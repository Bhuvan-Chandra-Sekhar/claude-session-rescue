[build-system]
# setuptools 77 is the first release that accepts an SPDX string for `license`
# and a `license-files` key. The older table form is deprecated and stops
# working in Feb 2027, so we use the modern spelling from the start.
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "claude-session-rescue"
version = "0.1.0"
description = "Find, diagnose and rescue Claude Code session history. Read-only."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Bhuvan Chandra Sekhar Reddy Ch" }]
keywords = ["claude", "claude-code", "transcript", "jsonl", "recovery", "compaction"]
# No "License ::" classifier: those are deprecated in favour of the SPDX
# `license` field above, and setuptools warns if both are present.
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Utilities",
]

# No runtime dependencies. Everything this tool does -- streaming JSONL,
# hashing, zipping, argument parsing -- is in the standard library, so the tool
# installs anywhere Python does and cannot break because of somebody else's
# release. pytest is the only dev dependency.
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.urls]
Homepage = "https://github.com/Bhuvan-Chandra-Sekhar/claude-session-rescue"
Issues = "https://github.com/Bhuvan-Chandra-Sekhar/claude-session-rescue/issues"

[project.scripts]
claude-session-rescue = "claude_session_rescue.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
